spring.application.name=Selenium-practice
browser=chrome
webdriver.chrome.driver.path= C:\\Users\\Larry\\chromedriver-win64\\chromedriver.exe

logging.level.org.springframework=DEBUG
logging.level.org.quartz=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3307/mysql
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.dataSource=mysql
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.threadPool.threadCount=10
spring.quartz.properties.org.quartz.dataSource.mysql.provider=hikaricp
spring.quartz.properties.org.quartz.dataSource.mysql.driver=com.mysql.cj.jdbc.Driver
spring.quartz.properties.org.quartz.dataSource.mysql.URL=${spring.datasource.url}
spring.quartz.properties.org.quartz.dataSource.mysql.user=${spring.datasource.username}
spring.quartz.properties.org.quartz.dataSource.mysql.password=${spring.datasource.password}
spring.quartz.properties.org.quartz.dataSource.mysql.maxConnections=5